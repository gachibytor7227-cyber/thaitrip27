<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Trip 2027 — Отели и Виллы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

    <!-- Верхняя панель -->
    <header class="sticky top-0 z-30 bg-slate-950 border-b border-slate-800 px-4 py-2.5 shadow-md">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-base font-black tracking-tight text-amber-400 flex items-center gap-1.5">
                    <span>🌴 Thai Trip 2027</span>
                    <span id="total-counter" class="text-[11px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">75 объектов</span>
                </h1>
                <p id="status-line" class="text-[11px] text-emerald-400 font-medium">⚡ Автообновление базы активно</p>
            </div>
            <!-- Смена имени -->
            <button type="button" onclick="changeUserName()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-200 cursor-pointer">
                <span>👤</span>
                <span id="current-user-label">Алексей</span>
                <span class="text-slate-500 text-[10px]">✎</span>
            </button>
        </div>

        <!-- Вкладки локаций -->
        <div class="max-w-xl mx-auto mt-2 flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
            <button type="button" onclick="setFilter('all')" id="tab-all" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-amber-500 text-slate-950 cursor-pointer">Все (75)</button>
            <button type="button" onclick="setFilter('bangkok')" id="tab-bangkok" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer">🏙 Бангкок • Башни (25)</button>
            <button type="button" onclick="setFilter('tao')" id="tab-tao" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer">🐢 Ко Тао • Отели (25)</button>
            <button type="button" onclick="setFilter('samui')" id="tab-samui" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer">🏝 Самуи • Виллы (25)</button>
            <button type="button" onclick="setFilter('top')" id="tab-top" class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer">🏆 Избранные</button>
        </div>

        <!-- Поиск и фильтр бюджета -->
        <div class="max-w-xl mx-auto mt-2 flex gap-2">
            <div class="relative flex-1">
                <input id="search-input" type="text" oninput="renderList()" placeholder="🔍 Поиск: инфинити, Сиам, Shark Bay, Бопут..." class="w-full bg-slate-900 border border-slate-800 focus:border-amber-500 rounded-xl pl-3 pr-7 py-1.5 text-xs text-white outline-none">
                <button type="button" onclick="clearSearch()" class="absolute right-2 top-1.5 text-slate-500 hover:text-white text-xs">✕</button>
            </div>
            <select id="price-filter" onchange="renderList()" class="bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 outline-none">
                <option value="all">Все цены</option>
                <option value="low">До 70 000 ₽</option>
                <option value="mid">70к – 120к ₽</option>
                <option value="high">От 120 000 ₽</option>
            </select>
        </div>

        <!-- Сортировка -->
        <div class="max-w-xl mx-auto mt-2 flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-900">
            <span id="shown-counter">Показано: 75</span>
            <div class="flex gap-1">
                <button type="button" onclick="setSort('default')" id="sort-default" class="sort-btn px-2 py-0.5 rounded-lg bg-slate-800 text-amber-400 font-bold cursor-pointer">По порядку</button>
                <button type="button" onclick="setSort('votes')" id="sort-votes" class="sort-btn px-2 py-0.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white cursor-pointer">🔥 По голосам</button>
                <button type="button" onclick="setSort('price_asc')" id="sort-price_asc" class="sort-btn px-2 py-0.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white cursor-pointer">💰 Дешевле</button>
                <button type="button" onclick="setSort('price_desc')" id="sort-price_desc" class="sort-btn px-2 py-0.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white cursor-pointer">💎 Дороже</button>
            </div>
        </div>
    </header>

    <!-- Список карточек -->
    <main class="max-w-xl mx-auto px-4 pt-3">
        <div id="properties-list" class="space-y-4"></div>
    </main>

    <!-- Нижняя панель -->
    <div class="fixed bottom-0 left-0 right-0 z-20 bg-slate-950 border-t border-slate-800 p-3">
        <div class="max-w-xl mx-auto flex gap-2">
            <button type="button" onclick="openAddModal()" class="flex-1 bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-black py-3 rounded-2xl text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer shadow-lg">
                <span class="text-base leading-none">＋</span> Добавить свой отель / виллу
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Добавление + Авто-парсер Booking.com -->
    <div id="add-modal" style="display: none !important;" class="fixed inset-0 z-50 bg-black/80 items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-black text-white">➕ Добавить свой вариант</h2>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-white text-2xl font-bold px-2 py-1 cursor-pointer">✕</button>
            </div>

            <div class="bg-blue-950/50 border border-blue-600/40 rounded-2xl p-3 mb-4">
                <label class="text-xs font-extrabold text-blue-300 block mb-1.5">⚡ Вставь ссылку с Booking.com (данные и фото подтянутся сами):</label>
                <div class="flex gap-2">
                    <input id="booking-parse-url" type="url" oninput="autoParseOnPaste()" placeholder="https://www.booking.com/hotel/th/..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-400">
                    <button type="button" onclick="parseBookingUrl()" id="parse-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold px-3.5 py-2 rounded-xl text-xs whitespace-nowrap cursor-pointer">
                        ⚡ Найти
                    </button>
                </div>
                <p id="parse-status" class="text-[11px] text-slate-400 mt-1.5">Автоматически найдет название, реальное фото отеля и даты</p>
            </div>

            <form id="add-form" onsubmit="submitNewProperty(event)" class="space-y-3 text-sm">
                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">Название отеля или виллы *</label>
                    <input id="f-title" type="text" required placeholder="Напр.: Eastin Grand Hotel Sathorn" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:border-amber-400 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">Локация *</label>
                        <select id="f-location" onchange="autoSetDatesByLocation()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
                            <option value="bangkok">🏙 Бангкок (Отель, 3 номера)</option>
                            <option value="tao">🐢 Ко Тао (Отель, 3 номера)</option>
                            <option value="samui">🏝 Самуи (Вилла 3 спальни)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-semibold block mb-1">Ночей и даты</label>
                        <div class="flex gap-1.5">
                            <input id="f-nights" type="number" min="1" max="30" value="3" required oninput="updatePricePreview()" class="w-14 bg-slate-950 border border-slate-700 rounded-xl px-2 py-2 text-white text-center outline-none">
                            <input id="f-dates" type="text" value="6–9 марта (3 номера)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-white text-xs outline-none">
                        </div>
                    </div>
                </div>

                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3">
                    <label class="text-xs text-amber-400 font-bold block mb-1.5">Общая стоимость на всех 5 человек (за 3 номера / виллу) *</label>
                    <div class="flex gap-2">
                        <input id="f-price" type="number" min="100" required placeholder="Например: 75000" oninput="updatePricePreview()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white font-bold outline-none">
                        <select id="f-currency" onchange="updatePricePreview()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-amber-400 font-bold outline-none">
                            <option value="RUB">₽ (Рубли)</option>
                            <option value="THB">฿ (Баты × 2.5)</option>
                        </select>
                    </div>
                    <p id="price-preview" class="text-[11px] text-slate-400 mt-2">Расчет появится после ввода суммы</p>
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">Ссылка на Booking</label>
                    <input id="f-url" type="url" placeholder="https://www.booking.com/..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white text-xs outline-none">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">Ссылка на фото (если пусто — найдет реальное фото отеля автоматически)</label>
                    <input id="f-image" type="url" placeholder="Оставь пустым для автопоиска фото по названию отеля" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white text-xs outline-none">
                </div>

                <div>
                    <label class="text-xs text-slate-400 font-semibold block mb-1">Описание (этажность, бассейн, пляж)</label>
                    <textarea id="f-notes" rows="2" placeholder="Напр.: Башня 33 этажа, панорамный инфинити-бассейн на 14 этаже" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-white text-xs outline-none"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-black py-3 rounded-2xl text-sm cursor-pointer">
                    ✅ Сохранить в общую базу
                </button>
            </form>
        </div>
    </div>

            document.getElementById("search-input").value = "";

            const loc = document.getElementById("f-location").value;
            const nightsEl = document.getElementById("f-nights");

            if (loc === "samui") {
                nightsEl.value = 7;

        async function supabaseRequest(endpoint, method = "GET", body = null) {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const headers = {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json"
            };
            if (method === "POST" || method === "PATCH") {
                headers["Prefer"] = "return=representation";
            }

            const response = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || `HTTP ${response.status}`);
            }

            if (response.status === 204) return [];
            return await response.json();
        }

                    d.added_by === "Booking.com" || 
                    d.added_by === "Подборка" || 
                    (d.image_url || "").includes("images.unsplash.com")
                );

                if (!data || data.length === 0 || v5Count !== 75 || hasLegacyRows) {
                    isAutoSyncing = true;
                    statusEl.innerText = "🔄 Автообновление фото и отелей в базе...";

                    // 1. Сохраняем все существующие голоса по названиям отелей, чтобы ничего не пропало!
                    const savedVotesByTitle = {};
                    (data || []).forEach(row => {
                        const t = (row.title || "").toLowerCase().trim();
                        if (row.votes && Object.keys(row.votes).length > 0) {
                            savedVotesByTitle[t] = row.votes;
                        }
                    });

                    // 2. Удаляем старые каталожные записи (пользовательские варианты не трогаем)
                    await supabaseRequest("thai_properties?added_by=in.(Booking.com,Подборка,Booking_v5_RealPhotos)", "DELETE");

                    // 3. Готовим обновленные 75 объектов с реальными фото и сохраненными голосами
                    const payload = BOOKING_CATALOG.map(({ id, ...rest }) => {
                        const key = rest.title.toLowerCase().trim();
                        return {
                            ...rest,
                            votes: savedVotesByTitle[key] || rest.votes || {}
                        };
                    });

                    // 4. Записываем в Supabase двумя быстрыми пакетами
                    for (let i = 0; i < payload.length; i += 40) {
                        await supabaseRequest("thai_properties", "POST", payload.slice(i, i + 40));
                    }

                    const fresh = await supabaseRequest("thai_properties?select=*&order=created_at.asc&limit=250");
                    if (fresh && fresh.length > 0) {
                        allProperties = fresh;
                        lastDataSignature = JSON.stringify(fresh.map(d => [d.id, d.votes, d.title, d.price_rub]));
                        updateCounters();
                        renderList();
                    }
                    isAutoSyncing = false;
                } else {
                    // База уже актуальна — проверяем, изменились ли голоса или новые отели
                    const newSignature = JSON.stringify(data.map(d => [d.id, d.votes, d.title, d.price_rub]));
                    if (newSignature !== lastDataSignature) {
                        allProperties = data;
                        lastDataSignature = newSignature;
                        updateCounters();
                        renderList();
                    }
                }

                const bkkCount = allProperties.filter(p => p.location === "bangkok").length;
                const taoCount = allProperties.filter(p => p.location === "tao").length;
                const samuiCount = allProperties.filter(p => p.location === "samui").length;
                statusEl.innerText = `🟢 Онлайн-база: ${bkkCount} Бангкок • ${taoCount} Ко Тао • ${samuiCount} Самуи`;
            } catch (err) {
                isAutoSyncing = false;
                console.warn("Автономный режим:", err.message);
                statusEl.innerText = `🟢 Каталог: 25 башен Бангкок • 25 Ко Тао • 25 Самуи`;
            }
        }

        // Авто-парсинг сразу при вставке ссылки
        let parseTimer = null;
        function autoParseOnPaste() {
            clearTimeout(parseTimer);
            const val = document.getElementById("booking-parse-url").value.trim();
            if (val.startsWith("http")) {
                parseTimer = setTimeout(parseBookingUrl, 300);
            }
        }

        async function parseBookingUrl() {
            const urlInput = document.getElementById("booking-parse-url");
            const status = document.getElementById("parse-status");
            const parseBtn = document.getElementById("parse-btn");
            const rawUrl = urlInput.value.trim();

            if (!rawUrl) return;

            parseBtn.innerText = "⏳...";
            status.innerText = "Ищем данные и реальное фото отеля...";
            document.getElementById("f-url").value = rawUrl;

            let detectedLoc = "bangkok";
            let extractedName = "";
            try {
                const u = new URL(rawUrl);
                const pathMatch = u.pathname.match(/\/hotel\/[a-z]{2}\/([^.\/]+)/i);
                if (pathMatch && pathMatch[1]) {
                    extractedName = pathMatch[1]
                        .replace(/\.[a-z-]+$/i, "")
                        .replace(/-/g, " ")
                        .replace(/\b\w/g, l => l.toUpperCase());
                    document.getElementById("f-title").value = extractedName;
                }

                const lowerUrl = rawUrl.toLowerCase();
                if (lowerUrl.includes("samui") || lowerUrl.includes("bophut") || lowerUrl.includes("lamai") || lowerUrl.includes("chaweng") || lowerUrl.includes("maenam")) {
                    detectedLoc = "samui";
                } else if (lowerUrl.includes("tao") || lowerUrl.includes("sairee") || lowerUrl.includes("shark")) {
                    detectedLoc = "tao";
                }
                document.getElementById("f-location").value = detectedLoc;
                autoSetDatesByLocation();
            } catch (e) {}

            // Сразу формируем реальное фото по названию отеля
            if (extractedName) {
                document.getElementById("f-image").value = buildRealHotelPhotoUrl(`${extractedName} Thailand hotel pool`, 0);
            }

            try {
                const ogRes = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(rawUrl)}`);
                if (ogRes.ok) {
                    const ogJson = await ogRes.json();
                    const d = ogJson?.data;
                    if (d?.title && !d.title.includes("Booking.com:")) {
                        const cleanTitle = d.title.replace(/\s*[-–|].*Booking\.com.*$/i, "").trim();
                        if (cleanTitle.length > 3) {
                            document.getElementById("f-title").value = cleanTitle;
                            document.getElementById("f-image").value = buildRealHotelPhotoUrl(`${cleanTitle} Thailand`, 0);
                        }
                    }
                    if (d?.image?.url && d.image.url.includes("bstatic.com")) {
                        document.getElementById("f-image").value = d.image.url;
                    }
                    if (d?.description) {
                        document.getElementById("f-notes").value = d.description.slice(0, 200);
                    }
                }
                status.innerText = "✅ Отель и его реальное фото найдены! Укажи цену ниже.";
                status.className = "text-[11px] text-emerald-400 font-semibold mt-1.5";
            } catch (e) {
                status.innerText = "✅ Ссылка и фото отеля готовы! Укажи стоимость.";
                status.className = "text-[11px] text-amber-400 font-semibold mt-1.5";
            } finally {
                parseBtn.innerText = "⚡ Найти";
            }
        }

        function updateCounters() {
            const countAll = allProperties.length;
            const countBkk = allProperties.filter(p => p.location === "bangkok").length;
            const countTao = allProperties.filter(p => p.location === "tao").length;
            const countSamui = allProperties.filter(p => p.location === "samui").length;
            const countTop = allProperties.filter(p => countVotes(p.votes, "yes") > 0).length;

            document.getElementById("total-counter").innerText = `${countAll} объектов`;
            document.getElementById("tab-all").innerText = `Все (${countAll})`;
            document.getElementById("tab-bangkok").innerText = `🏙 Бангкок • Башни (${countBkk})`;
            document.getElementById("tab-tao").innerText = `🐢 Ко Тао • Отели (${countTao})`;
            document.getElementById("tab-samui").innerText = `🏝 Самуи • Виллы (${countSamui})`;
            document.getElementById("tab-top").innerText = `🏆 За (${countTop})`;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer";
            });
            const activeBtn = document.getElementById("tab-" + filter);
            if (activeBtn) {
                activeBtn.className = "filter-btn px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-amber-500 text-slate-950 cursor-pointer";
            }
            renderList();
        }

        function setSort(sortType) {
            currentSort = sortType;
            document.querySelectorAll(".sort-btn").forEach(btn => {
                btn.className = "sort-btn px-2 py-0.5 rounded-lg bg-slate-900 text-slate-400 hover:text-white cursor-pointer";
            });
            const activeSort = document.getElementById("sort-" + sortType);
            if (activeSort) {
                activeSort.className = "sort-btn px-2 py-0.5 rounded-lg bg-slate-800 text-amber-400 font-bold cursor-pointer";
            }
            renderList();
        }

        function formatRub(num) {
            return Math.round(num).toLocaleString("ru-RU") + " ₽";
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function countVotes(votesObj, type) {
            if (!votesObj) return 0;
            return Object.values(votesObj).filter(v => v === type).length;
        }

        function renderCardInnerHtml(p, idx) {
            const totalRub = Number(p.price_rub) || 0;
            const isVilla = p.location === "samui";
            const nights = Number(p.nights) || (isVilla ? 7 : 3);
            const perNightRub = totalRub / nights;

            const coupleRub = isVilla ? (totalRub * 0.4) : (totalRub * 0.35);
            const singleRub = isVilla ? (totalRub * 0.2) : (totalRub * 0.30);

            const col1Title = isVilla ? `Вилла (${nights} н.)` : `За 3 номера (${nights} н.)`;
            const col2Title = isVilla ? `С пары (40%)` : `1 номер (Пара)`;
            const col2Sub   = isVilla ? `за двоих` : `отдельный номер`;
            const col3Title = isVilla ? `С 1 чел (20%)` : `1 номер (Сингл)`;
            const col3Sub   = isVilla ? `за одного` : `отдельный номер`;

            const votesObj = p.votes || {};
            const myVote = votesObj[currentUser] || null;

            const yesUsers = Object.entries(votesObj).filter(([_, v]) => v === "yes").map(([u]) => u);
            const maybeUsers = Object.entries(votesObj).filter(([_, v]) => v === "maybe").map(([u]) => u);
            const noUsers = Object.entries(votesObj).filter(([_, v]) => v === "no").map(([u]) => u);

            const imgSrc = getAccuratePhoto(p, idx);
            const backupQuery = encodeURIComponent((p.title || "Thailand Hotel").replace(/\([^)]*\)/g, "").trim());
            const backupImg = `https://th.bing.com/th?q=${backupQuery}&w=600&h=360&c=7&rs=1`;
            const locLabel = LOCATION_NAMES[p.location] || p.location;

            return `
                <div class="relative h-52 w-full bg-slate-800">
                    <img src="${escapeHtml(imgSrc)}" loading="lazy" decoding="async" alt="${escapeHtml(p.title)}" onerror="if(this.src!=='${backupImg}'){this.src='${backupImg}';}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/35"></div>
                    
                    <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
                        <span class="bg-slate-950/90 text-amber-400 text-xs font-extrabold px-2.5 py-1 rounded-full border border-amber-500/30">
                            ${locLabel}
                        </span>
                        <span class="bg-slate-950/90 text-slate-200 text-xs font-semibold px-2.5 py-1 rounded-full">
                            🗓 ${escapeHtml(p.dates_text || (nights + ' ночей'))}
                        </span>
                    </div>

                    <div class="absolute top-3 right-3 flex items-center gap-1.5">
                        <span class="bg-emerald-500 text-slate-950 text-xs font-black px-2.5 py-1 rounded-full">
                            🔥 За: ${yesUsers.length}/5
                        </span>
                        <button type="button" onclick="deleteProperty('${p.id}')" class="bg-slate-950/85 hover:bg-rose-600 text-slate-300 hover:text-white text-xs px-2.5 py-1 rounded-full cursor-pointer" title="Удалить">🗑</button>
                    </div>

                    <div class="absolute bottom-2.5 left-3 right-3">
                        <h2 class="text-base font-black text-white leading-snug drop-shadow">${escapeHtml(p.title)}</h2>
                    </div>
                </div>

                <div class="p-4 space-y-3">
                    ${p.notes ? `<p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(p.notes)}</p>` : ''}

                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-2.5 grid grid-cols-3 gap-2 text-center">
                        <div class="border-r border-slate-800 pr-1">
                            <span class="text-[10px] text-slate-400 block">${col1Title}</span>
                            <span class="text-sm font-extrabold text-white">${formatRub(totalRub)}</span>
                            <span class="text-[10px] text-slate-500 block">${formatRub(perNightRub)}/сут</span>
                        </div>
                        <div class="border-r border-slate-800 px-1">
                            <span class="text-[10px] text-amber-400 font-bold block">${col2Title}</span>
                            <span class="text-base font-black text-amber-400">${formatRub(coupleRub)}</span>
                            <span class="text-[10px] text-amber-500/70 block">${col2Sub}</span>
                        </div>
                        <div class="pl-1">
                            <span class="text-[10px] text-slate-400 block">${col3Title}</span>
                            <span class="text-sm font-bold text-slate-200">${formatRub(singleRub)}</span>
                            <span class="text-[10px] text-slate-500 block">${col3Sub}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="castVote('${p.id}', 'yes', ${idx})" class="py-2 rounded-xl text-xs font-extrabold cursor-pointer ${myVote === 'yes' ? 'bg-emerald-500 text-slate-950 ring-2 ring-white' : 'bg-emerald-950/70 text-emerald-300 border border-emerald-700/60'}">
                            👍 За (${yesUsers.length})
                        </button>
                        <button type="button" onclick="castVote('${p.id}', 'maybe', ${idx})" class="py-2 rounded-xl text-xs font-extrabold cursor-pointer ${myVote === 'maybe' ? 'bg-amber-400 text-slate-950 ring-2 ring-white' : 'bg-amber-950/60 text-amber-300 border border-amber-700/50'}">
                            🤔 Думаю (${maybeUsers.length})
                        </button>
                        <button type="button" onclick="castVote('${p.id}', 'no', ${idx})" class="py-2 rounded-xl text-xs font-extrabold cursor-pointer ${myVote === 'no' ? 'bg-rose-500 text-white ring-2 ring-white' : 'bg-rose-950/60 text-rose-300 border border-rose-700/50'}">
                            👎 Нет (${noUsers.length})
                        </button>
                        ${p.booking_url ? `
                        <a href="${escapeHtml(p.booking_url)}" target="_blank" rel="noopener noreferrer" class="py-2 rounded-xl text-xs font-bold bg-blue-950/80 hover:bg-blue-900 text-blue-200 border border-blue-700/60 flex items-center justify-center gap-1">
                            🔗 Booking
                        </a>` : `
                        <span class="py-2 rounded-xl text-[11px] text-slate-600 bg-slate-900 border border-slate-800 flex items-center justify-center">Без ссылки</span>
                        `}
                    </div>

                    <div class="bg-slate-950/60 rounded-xl p-2 text-[11px] space-y-1 border border-slate-800/60">
                        <div class="flex items-start gap-1.5">
                            <span class="text-emerald-400 font-bold shrink-0">👍 За:</span>
                            <span class="text-slate-200">${yesUsers.length ? yesUsers.map(escapeHtml).join(', ') : '<span class="text-slate-600">пока никто</span>'}</span>
                        </div>
                        ${maybeUsers.length ? `
                        <div class="flex items-start gap-1.5">
                            <span class="text-amber-400 font-bold shrink-0">🤔 Думают:</span>
                            <span class="text-slate-300">${maybeUsers.map(escapeHtml).join(', ')}</span>
                        </div>` : ''}
                        ${noUsers.length ? `
                        <div class="flex items-start gap-1.5">
                            <span class="text-rose-400 font-bold shrink-0">👎 Против:</span>
                            <span class="text-slate-400">${noUsers.map(escapeHtml).join(', ')}</span>
                        </div>` : ''}
                    </div>
                </div>`;
        }

        function renderList() {
            const container = document.getElementById("properties-list");
            const searchVal = (document.getElementById("search-input")?.value || "").toLowerCase().trim();
            const priceFilter = document.getElementById("price-filter")?.value || "all";

            let items = [...allProperties];

            if (currentFilter === "top") {
                items = items.filter(p => countVotes(p.votes, "yes") > 0 || countVotes(p.votes, "maybe") > 0);
                items.sort((a, b) => countVotes(b.votes, "yes") - countVotes(a.votes, "yes"));
            } else if (currentFilter !== "all") {
                items = items.filter(p => p.location === currentFilter);
            }

            if (searchVal) {
                items = items.filter(p => 
                    (p.title || "").toLowerCase().includes(searchVal) ||
                    (p.notes || "").toLowerCase().includes(searchVal)
                );
            }

            if (priceFilter === "low") {
                items = items.filter(p => (Number(p.price_rub) || 0) <= 70000);
            } else if (priceFilter === "mid") {
                items = items.filter(p => (Number(p.price_rub) || 0) > 70000 && (Number(p.price_rub) || 0) <= 120000);
            } else if (priceFilter === "high") {
                items = items.filter(p => (Number(p.price_rub) || 0) > 120000);
            }

            if (currentSort === "votes") {
                items.sort((a, b) => countVotes(b.votes, "yes") - countVotes(a.votes, "yes"));
            } else if (currentSort === "price_asc") {
                items.sort((a, b) => (Number(a.price_rub) || 0) - (Number(b.price_rub) || 0));
            } else if (currentSort === "price_desc") {
                items.sort((a, b) => (Number(b.price_rub) || 0) - (Number(a.price_rub) || 0));
            }

            document.getElementById("shown-counter").innerText = `Показано: ${items.length}`;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-12 text-sm">По выбранным фильтрам ничего не найдено</div>`;
                return;
            }

            container.innerHTML = items.map((p, idx) => `
                <article id="card-${p.id}" class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-lg">
                    ${renderCardInnerHtml(p, idx)}
                </article>
            `).join("");
        }

        async function castVote(propertyId, voteType, idx = 0) {
            const item = allProperties.find(p => String(p.id) === String(propertyId));
            if (!item) return;

            const updatedVotes = { ...(item.votes || {}) };
            if (updatedVotes[currentUser] === voteType) {
                delete updatedVotes[currentUser];
            } else {
                updatedVotes[currentUser] = voteType;
            }

            item.votes = updatedVotes;
            updateCounters();

            const cardEl = document.getElementById(`card-${propertyId}`);
            if (cardEl && currentFilter !== "top" && currentSort !== "votes") {
                cardEl.innerHTML = renderCardInnerHtml(item, idx);
            } else {
                renderList();
            }

            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

            try {
                await supabaseRequest(`thai_properties?id=eq.${propertyId}`, "PATCH", { votes: updatedVotes });
            } catch (err) {
                console.warn("Локальный голос:", err.message);
            }
        }

        async function deleteProperty(propertyId) {
            if (!confirm("Удалить этот вариант из списка?")) return;
            allProperties = allProperties.filter(p => String(p.id) !== String(propertyId));
            updateCounters();
            const cardEl = document.getElementById(`card-${propertyId}`);
            if (cardEl) cardEl.remove();

            try {
                await supabaseRequest(`thai_properties?id=eq.${propertyId}`, "DELETE");
            } catch (err) {}
        }

        function updatePricePreview() {
            const rawPrice = Number(document.getElementById("f-price").value) || 0;
            const currency = document.getElementById("f-currency").value;
            const loc = document.getElementById("f-location").value;
            const totalRub = currency === "THB" ? Math.round(rawPrice * 2.5) : rawPrice;
            if (loc === "samui") {
                document.getElementById("price-preview").innerText = 
                    `Вилла: ${formatRub(totalRub)} • С пары (40%): ${formatRub(totalRub * 0.4)} • С 1 чел (20%): ${formatRub(totalRub * 0.2)}`;
            } else {
                document.getElementById("price-preview").innerText = 
                    `За 3 номера: ${formatRub(totalRub)} • 1 номер (пара): ${formatRub(totalRub * 0.35)} • 1 номер (сингл): ${formatRub(totalRub * 0.30)}`;
            }
        }

        async function submitNewProperty(e) {
            e.preventDefault();

            const titleVal = document.getElementById("f-title").value.trim();
            const rawPrice = Number(document.getElementById("f-price").value) || 0;
            const currency = document.getElementById("f-currency").value;
            const loc = document.getElementById("f-location").value;
            const priceRub = currency === "THB" ? Math.round(rawPrice * 2.5) : Math.round(rawPrice);

            const rawImage = document.getElementById("f-image").value.trim();
            const locSearch = loc === "bangkok" ? "Bangkok hotel pool" : (loc === "tao" ? "Koh Tao resort" : "Koh Samui villa pool");
            const finalImage = rawImage.startsWith("http") 
                ? rawImage 
                : buildRealHotelPhotoUrl(`${titleVal} ${locSearch}`, 0);

            const newItem = {
                title: titleVal,
                location: loc,
                nights: Number(document.getElementById("f-nights").value) || 3,
                dates_text: document.getElementById("f-dates").value.trim() || "6–9 марта (3 номера)",
                price_rub: priceRub,
                booking_url: document.getElementById("f-url").value.trim(),
                image_url: finalImage,
                notes: document.getElementById("f-notes").value.trim(),
                added_by: currentUser,
                votes: { [currentUser]: "yes" }
            };

            const btn = document.getElementById("submit-btn");
            btn.innerText = "Сохраняем...";
            btn.disabled = true;

            try {
                const res = await supabaseRequest("thai_properties", "POST", [newItem]);
                if (res && res[0]) {
                    allProperties.unshift(res[0]);
                } else {
                    allProperties.unshift({ ...newItem, id: "local_" + Date.now() });
                }
                document.getElementById("add-form").reset();
                closeAddModal();
                updateCounters();
                renderList();
            } catch (err) {
                alert("Ошибка сохранения: " + err.message);
            } finally {
                btn.innerText = "✅ Сохранить в общую базу";
                btn.disabled = false;
            }
        }

        // Мгновенная отрисовка + запуск фонового автообновления базы каждые 4 секунды
        updateCounters();
        renderList();
        autoSyncDatabase();
        setInterval(autoSyncDatabase, 4000);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) autoSyncDatabase();
        });
    </script>
</body>
</html>
