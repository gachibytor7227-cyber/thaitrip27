        let allProperties = [];
        let currentFilter = "all";

        // Быстрый сетевой клиент к REST API Supabase
        async function supabaseRequest(endpoint, method = "GET", body = null) {
            const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
            const headers = {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json"
            };
            if (method === "POST" || method === "PATCH") {
                headers["Prefer"] = "return=representation";
            }

            const response = await fetch(url, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(errText || `HTTP ${response.status}`);
            }

            if (response.status === 204) return [];
            return await response.json();
        }

        // Загрузка отелей из базы
        async function loadProperties() {
            const listEl = document.getElementById("properties-list");
            try {
                const data = await supabaseRequest("thai_properties?select=*&order=created_at.desc");
                allProperties = data || [];

                const seedBanner = document.getElementById("seed-banner");
                if (allProperties.length === 0) {
                    seedBanner.classList.remove("hidden");
                } else {
                    seedBanner.classList.add("hidden");
                }

                renderList();
            } catch (err) {
                listEl.innerHTML = `
                <div class="bg-rose-950/60 border border-rose-700 p-4 rounded-2xl text-xs text-rose-200">
                    <p class="font-bold text-rose-400 mb-1">Ошибка подключения к таблице Supabase:</p>
                    <p class="font-mono text-[11px] mb-2">${escapeHtml(err.message)}</p>
                    <p class="text-slate-400">Убедись, что ты запустил SQL-запрос создания таблицы в панели Supabase.</p>
                </div>`;
            }
        }

        // Загрузить стартовые 8 отелей в базу
        async function seedStarterProperties() {
            try {
                await supabaseRequest("thai_properties", "POST", STARTER_PACK);
                loadProperties();
            } catch (err) {
                alert("Ошибка сохранения подборки: " + err.message);
            }
        }

            currentFilter = filter;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 cursor-pointer";

            if (activeBtn) {
                activeBtn.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-amber-500 text-slate-950 shadow cursor-pointer";
            }
            renderList();
        }

        function formatRub(num) {
            return Math.round(num).toLocaleString("ru-RU") + " ₽";
        }

        function escapeHtml(str) {
            if (!str) return "";
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function countVotes(votesObj, type) {
            if (!votesObj) return 0;
            return Object.values(votesObj).filter(v => v === type).length;
        }

        // Отрисовка списка карточек
        function renderList() {
            const container = document.getElementById("properties-list");
            let items = [...allProperties];

            if (currentFilter === "top") {
                items.sort((a, b) => countVotes(b.votes, "yes") - countVotes(a.votes, "yes"));
            } else if (currentFilter !== "all") {
                items = items.filter(p => p.location === currentFilter);
            }

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-12 text-sm">В этой категории пока нет вариантов</div>`;

            }

                const totalRub = Number(p.price_rub) || 0;
                const coupleRub = totalRub * 0.4; // 40% с пары
                const singleRub = totalRub * 0.2; // 20% с одного
                const nights = Number(p.nights) || 3;
                const perNightRub = totalRub / nights;

                const votesObj = p.votes || {};
                const myVote = votesObj[currentUser] || null;

                const yesUsers = Object.entries(votesObj).filter(([_, v]) => v === "yes").map(([u]) => u);
                const maybeUsers = Object.entries(votesObj).filter(([_, v]) => v === "maybe").map(([u]) => u);
                const noUsers = Object.entries(votesObj).filter(([_, v]) => v === "no").map(([u]) => u);

                const imgSrc = p.image_url || FALLBACK_IMAGES[p.location] || FALLBACK_IMAGES.bangkok;
                const locLabel = LOCATION_NAMES[p.location] || p.location;

                return `
                <article class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                    <div class="relative h-52 w-full bg-slate-800">
                        <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(p.title)}" onerror="this.src='${FALLBACK_IMAGES.bangkok}'" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/40"></div>
                        
                        <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
                            <span class="bg-slate-950/85 backdrop-blur-md text-amber-400 text-xs font-extrabold px-3 py-1 rounded-full border border-amber-500/30">
                                ${locLabel}
                            </span>
                            <span class="bg-slate-950/85 backdrop-blur-md text-slate-200 text-xs font-semibold px-2.5 py-1 rounded-full">
                                🗓 ${escapeHtml(p.dates_text || (nights + ' ночей'))}
                            </span>
                        </div>

                        <div class="absolute top-3 right-3 flex items-center gap-1.5">
                            <span class="bg-emerald-500/90 text-slate-950 text-xs font-black px-2.5 py-1 rounded-full shadow">
                                🔥 За: ${yesUsers.length}/5
                            </span>
                            <button type="button" onclick="deleteProperty('${p.id}')" class="bg-slate-950/70 hover:bg-rose-600 active:scale-90 text-slate-300 hover:text-white text-xs px-2.5 py-1 rounded-full transition cursor-pointer" title="Удалить карточку">🗑</button>
                        </div>

                        <div class="absolute bottom-3 left-3 right-3">
                            <h2 class="text-base sm:text-lg font-black text-white leading-snug drop-shadow">${escapeHtml(p.title)}</h2>
                        </div>
                    </div>

                    <div class="p-4 space-y-3.5">
                        ${p.notes ? `<p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(p.notes)}</p>` : ''}

                        <div class="bg-slate-950 border border-slate-800/90 rounded-2xl p-3 grid grid-cols-3 gap-2 text-center">
                            <div class="border-r border-slate-800 pr-1">
                                <span class="text-[10px] text-slate-400 block">Всего (на 5 чел)</span>
                                <span class="text-sm font-extrabold text-white">${formatRub(totalRub)}</span>
                                <span class="text-[10px] text-slate-500 block">${formatRub(perNightRub)}/сут</span>
                            </div>
                            <div class="border-r border-slate-800 px-1">
                                <span class="text-[10px] text-amber-400 font-bold block">С пары (40%)</span>
                                <span class="text-base font-black text-amber-400">${formatRub(coupleRub)}</span>
                                <span class="text-[10px] text-amber-500/70 block">за двоих</span>
                            </div>
                            <div class="pl-1">
                                <span class="text-[10px] text-slate-400 block">С одного (20%)</span>
                                <span class="text-sm font-bold text-slate-200">${formatRub(singleRub)}</span>
                                <span class="text-[10px] text-slate-500 block">за 1 чел</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-2">
                            <button type="button" onclick="castVote('${p.id}', 'yes')" class="py-2.5 rounded-xl text-xs font-extrabold transition active:scale-95 cursor-pointer ${myVote === 'yes' ? 'bg-emerald-500 text-slate-950 ring-2 ring-white shadow-lg' : 'bg-emerald-950/70 text-emerald-300 border border-emerald-700/60 hover:bg-emerald-800/50'}">
                                👍 За (${yesUsers.length})
                            </button>
                            <button type="button" onclick="castVote('${p.id}', 'maybe')" class="py-2.5 rounded-xl text-xs font-extrabold transition active:scale-95 cursor-pointer ${myVote === 'maybe' ? 'bg-amber-400 text-slate-950 ring-2 ring-white shadow-lg' : 'bg-amber-950/60 text-amber-300 border border-amber-700/50 hover:bg-amber-800/40'}">
                                🤔 Думаю (${maybeUsers.length})
                            </button>
                            <button type="button" onclick="castVote('${p.id}', 'no')" class="py-2.5 rounded-xl text-xs font-extrabold transition active:scale-95 cursor-pointer ${myVote === 'no' ? 'bg-rose-500 text-white ring-2 ring-white shadow-lg' : 'bg-rose-950/60 text-rose-300 border border-rose-700/50 hover:bg-rose-800/40'}">
                                👎 Нет (${noUsers.length})
                            </button>
                            ${p.booking_url ? `
                            <a href="${escapeHtml(p.booking_url)}" target="_blank" rel="noopener noreferrer" class="py-2.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-100 border border-slate-700 flex items-center justify-center gap-1 transition">
                                🔗 Сайт
                            </a>` : `
                            <span class="py-2.5 rounded-xl text-[11px] text-slate-600 bg-slate-900 border border-slate-800 flex items-center justify-center">Без ссылки</span>
                            `}
                        </div>

                        <div class="bg-slate-950/60 rounded-xl p-2.5 text-[11px] space-y-1 border border-slate-800/60">
                            <div class="flex items-start gap-1.5">
                                <span class="text-emerald-400 font-bold shrink-0">👍 За:</span>
                                <span class="text-slate-200">${yesUsers.length ? yesUsers.map(escapeHtml).join(', ') : '<span class="text-slate-600">пока никто</span>'}</span>
                            </div>
                            ${maybeUsers.length ? `
                            <div class="flex items-start gap-1.5">
                                <span class="text-amber-400 font-bold shrink-0">🤔 Думают:</span>
                                <span class="text-slate-300">${maybeUsers.map(escapeHtml).join(', ')}</span>
                            </div>` : ''}
                            ${noUsers.length ? `
                            <div class="flex items-start gap-1.5">
                                <span class="text-rose-400 font-bold shrink-0">👎 Против:</span>
                                <span class="text-slate-400">${noUsers.map(escapeHtml).join(', ')}</span>
                            </div>` : ''}
                            <div class="text-[10px] text-slate-500 pt-1 border-t border-slate-800/60 flex justify-between">
                                <span>Добавил(а): ${escapeHtml(p.added_by || 'Участник')}</span>
                                <span>Повторный клик снимает голос</span>
                            </div>
                        </div>
                    </div>
                </article>`;
            }).join("");
        }

        // Голосование
        async function castVote(propertyId, voteType) {
            const item = allProperties.find(p => p.id === propertyId);
            if (!item) return;

            const updatedVotes = { ...(item.votes || {}) };
            if (updatedVotes[currentUser] === voteType) {
                delete updatedVotes[currentUser];
            } else {
                updatedVotes[currentUser] = voteType;
            }

            item.votes = updatedVotes;
            renderList();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

            try {
                await supabaseRequest(`thai_properties?id=eq.${propertyId}`, "PATCH", { votes: updatedVotes });
            } catch (err) {
                alert("Ошибка сохранения голоса: " + err.message);
                loadProperties();
            }
        }

        // Удаление
        async function deleteProperty(propertyId) {
            if (!confirm("Удалить этот вариант из общего списка?")) return;
            allProperties = allProperties.filter(p => p.id !== propertyId);
            renderList();

            try {
                await supabaseRequest(`thai_properties?id=eq.${propertyId}`, "DELETE");
            } catch (err) {
                alert("Ошибка удаления: " + err.message);
                loadProperties();
            }
        }

        function updatePricePreview() {
            const rawPrice = Number(document.getElementById("f-price").value) || 0;
            const currency = document.getElementById("f-currency").value;
            const totalRub = currency === "THB" ? Math.round(rawPrice * 2.5) : rawPrice;
            document.getElementById("price-preview").innerText = 
                `Итого: ${formatRub(totalRub)} • С пары (40%): ${formatRub(totalRub * 0.4)} • С 1 чел (20%): ${formatRub(totalRub * 0.2)}`;
        }

        async function submitNewProperty(e) {
            e.preventDefault();

            const rawPrice = Number(document.getElementById("f-price").value) || 0;
            const currency = document.getElementById("f-currency").value;
            const priceRub = currency === "THB" ? Math.round(rawPrice * 2.5) : Math.round(rawPrice);

            const newItem = {
                title: document.getElementById("f-title").value.trim(),
                location: document.getElementById("f-location").value,
                nights: Number(document.getElementById("f-nights").value) || 3,
                dates_text: document.getElementById("f-dates").value.trim() || "Март 2027",
                price_rub: priceRub,
                booking_url: document.getElementById("f-url").value.trim(),
                image_url: document.getElementById("f-image").value.trim(),
                notes: document.getElementById("f-notes").value.trim(),
                added_by: currentUser,
                votes: { [currentUser]: "yes" }
            };

            const btn = document.getElementById("submit-btn");
            btn.innerText = "Сохраняем...";
            btn.disabled = true;

            try {
                await supabaseRequest("thai_properties", "POST", [newItem]);
                document.getElementById("add-form").reset();
                closeAddModal();
                loadProperties();
            } catch (err) {
                alert("Ошибка сохранения: " + err.message);
            } finally {
                btn.innerText = "✅ Сохранить в общую базу";
                btn.disabled = false;
            }
        }

        // Запуск
        loadProperties();
        // Автообновление каждые 5 секунд (чтобы видеть новые голоса друзей)
        setInterval(loadProperties, 5000);
    </script>
</body>
</html>
